name: Build Colonel Fried Chicken POS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -q colonel_fried_chicken_pos_flutter.zip
          cd colonel_fried_chicken_pos
          flutter create --platforms=android .

      - name: Install packages
        working-directory: colonel_fried_chicken_pos
        run: flutter pub get

      - name: Build APK
        working-directory: colonel_fried_chicken_pos
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Colonel-Fried-Chicken-POS-APK
          path: colonel_fried_chicken_pos/build/app/outputs/flutter-apk/app-release.apk
